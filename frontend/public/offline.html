<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン — なみログ</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fffbf6;
        color: #4a4458;
        font-family: "M PLUS Rounded 1c", "BIZ UDPGothic",
          "Hiragino Maru Gothic ProN", "Yu Gothic Medium", "Hiragino Sans",
          sans-serif;
        line-height: 1.7;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .mark {
        font-size: 44px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p {
        font-size: 14px;
        margin: 0;
      }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 24px;
        border: none;
        border-radius: 24px;
        background: #7e5ea6;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">🌊</div>
      <h1>オフラインです</h1>
      <p>いまはインターネットにつながっていないみたい。<br />通信が回復したら、もう一度ひらいてみてね。</p>
      <button onclick="location.reload()">もう一度読み込む</button>
    </div>
  </body>
</html>
