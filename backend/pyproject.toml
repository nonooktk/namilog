[project]
name = "namilog-backend"
version = "0.1.0"
description = "なみログ バックエンド（FastAPI）。全データアクセスの入口・認証検証・予測パイプライン（M3）。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "psycopg[binary]>=3.2,<3.3",
    "psycopg-pool>=3.2,<3.3",
    "pyjwt[crypto]>=2.9,<2.11",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
